version: "3.9"

# ============================================================
# Autonomous Document Intelligence — Local Dev Stack
#
# Services:
#   qdrant  — Vector database (persisted via Docker volume)
#   api     — FastAPI application (built from ./Dockerfile)
#
# Usage:
#   docker-compose up --build          # build + start all services
#   docker-compose up --build api      # restart only the API
#   docker-compose down -v             # stop + remove volumes
#
# ETL (run once after stack is up):
#   docker-compose exec api python etl/pipeline.py /app/data/<your>.pdf
# ============================================================

services:

  # ----------------------------------------------------------
  # Qdrant vector database
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: patronus_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - patronus_net

  # ----------------------------------------------------------
  # FastAPI application
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: patronus_api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env                      # mounts your local .env at build time
    environment:
      # Override QDRANT_URL so the API container reaches Qdrant
      # by its Docker service name instead of localhost
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Mount the data directory so PDFs can be dropped in and
      # the ETL pipeline can read them without rebuilding the image
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - patronus_net

# ----------------------------------------------------------
# Named volume — persists Qdrant data across restarts
# ----------------------------------------------------------
volumes:
  qdrant_data:

# ----------------------------------------------------------
# Shared network
# ----------------------------------------------------------
networks:
  patronus_net:
    driver: bridge
